name: Build & Notarize macOS DMG

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-release:
    runs-on: macos-14
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_15.4.app || sudo xcode-select -s /Applications/Xcode.app

      - name: Install create-dmg
        run: brew install create-dmg

      - name: Set up Signing Certificate
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.MACOS_CERTIFICATE }}
          P12_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PWD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD || 'temporary-password' }}
        run: |
          if [ -n "$BUILD_CERTIFICATE_BASE64" ]; then
            CERTIFICATE_PATH=$RUNNER_TEMP/build_certificate.p12
            KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db

            echo -n "$BUILD_CERTIFICATE_BASE64" | base64 --decode -o $CERTIFICATE_PATH

            security create-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
            security set-keychain-settings -lut 21600 $KEYCHAIN_PATH
            security unlock-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH

            security import $CERTIFICATE_PATH -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k $KEYCHAIN_PATH
            security list-keychain-db -i -s $KEYCHAIN_PATH
          else
            echo "⚠️ No certificate secret provided, building unsigned"
          fi

      - name: Build Universal Release App
        working-directory: CosmoWhisper
        run: |
          mkdir -p build_release release
          xcodebuild -project CosmoWhisper.xcodeproj \
                     -scheme CosmoWhisper \
                     -configuration Release \
                     -derivedDataPath ./build_release \
                     ARCHS="arm64 x86_64" \
                     ONLY_ACTIVE_ARCH=NO \
                     clean build

      - name: Codesign App Bundle
        working-directory: CosmoWhisper
        env:
          SIGNING_IDENTITY: "Developer ID Application: Louis de Souza (9AAQ3L289K)"
        run: |
          APP_BUNDLE="./build_release/Build/Products/Release/CosmoWhisper.app"
          ENTITLEMENTS="CosmoWhisper/CosmoWhisper.entitlements"
          if security find-identity -v -p codesigning | grep -q "Developer ID Application"; then
            codesign --force --options runtime --deep --sign "$SIGNING_IDENTITY" --entitlements "$ENTITLEMENTS" "$APP_BUNDLE"
          fi

      - name: Create DMG Installer
        working-directory: CosmoWhisper
        run: |
          APP_BUNDLE="./build_release/Build/Products/Release/CosmoWhisper.app"
          DMG_STAGING="./build_release/dmg_staging"
          DMG_PATH="./release/CosmoWhisper_Universal.dmg"
          
          mkdir -p "$DMG_STAGING"
          cp -R "$APP_BUNDLE" "$DMG_STAGING/"
          ln -s /Applications "$DMG_STAGING/Applications"
          
          create-dmg \
            --volname "CosmoWhisper Installer" \
            --window-pos 200 120 \
            --window-size 660 400 \
            --icon-size 128 \
            --icon "CosmoWhisper.app" 180 200 \
            --hide-extension "CosmoWhisper.app" \
            --app-drop-link 480 200 \
            --skip-jenkins \
            "$DMG_PATH" \
            "$DMG_STAGING" || hdiutil create -volname "CosmoWhisper Installer" -srcfolder "$DMG_STAGING" -ov -format UDZO "$DMG_PATH"

      - name: Notarize and Staple DMG
        working-directory: CosmoWhisper
        env:
          APPLE_ID: ${{ secrets.APPLE_ID || 'louisdesouza@gmail.com' }}
          APPLE_PASS: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD || 'enus-gkwr-gybr-koov' }}
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID || '9AAQ3L289K' }}
          SIGNING_IDENTITY: "Developer ID Application: Louis de Souza (9AAQ3L289K)"
        run: |
          DMG_PATH="./release/CosmoWhisper_Universal.dmg"
          if security find-identity -v -p codesigning | grep -q "Developer ID Application"; then
            codesign --force --sign "$SIGNING_IDENTITY" "$DMG_PATH"
            xcrun notarytool submit "$DMG_PATH" --apple-id "$APPLE_ID" --password "$APPLE_PASS" --team-id "$TEAM_ID" --wait
            xcrun stapler staple "$DMG_PATH"
          fi

      - name: Upload DMG Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CosmoWhisper_Universal_DMG
          path: CosmoWhisper/release/CosmoWhisper_Universal.dmg

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: CosmoWhisper/release/CosmoWhisper_Universal.dmg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
